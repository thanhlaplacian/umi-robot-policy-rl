# Smoke: 20 optimizer steps of plain flow-matching SFT on one labelled rebot dataset, 8 GPUs, FSDP2.
# Proves the RLinf FSDP training loop drives the company model end to end (loss, grad, ckpt).
defaults:
  - /hybrid_engines/fsdp@actor.fsdp_config
  - /model/gr00t_n1d7_umi@actor.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: /home/thanh/rlinf-runs/logs/umi-rl
    project_name: finetune-gr00t-n1d7
    experiment_name: umi-rl-offline-sft-smoke
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 1
  max_steps: 20
  val_check_interval: -1
  save_interval: 20
  log_interval: 1
  resume_dir: null

data:
  train_data_paths:
    - path: /data/dataset/26-W33-TELE2-rebot-batch1
      embodiment_tag: umi_bimanual_v2
      steam_optimality: true
      steam_optimality_threshold: 0.0
  steam_label_version: v0.2.16
  steps_per_epoch: 20
  num_workers: 4
  video_backend: pyav

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64      # 8 ranks x 4 x accum 2
  seed: 42
  model:
    precision: "fp32"        # fp32 master weights under bf16 autocast, like the fork's trainer
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-5
    clip_grad: 1.0
    lr_scheduler: "constant"
    lr_warmup_steps: 0
    lr_warmup_steps_ratio: 0.0
    total_training_steps: null
  fsdp_config:
    strategy: "fsdp2"
    wrap_policy:
      no_split_names: ["Qwen3VLTextDecoderLayer", "Qwen3VLVisionBlock", "BasicTransformerBlock"]
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    limit_all_gathers: False
    forward_prefetch: True
    backward_prefetch: "pre"
    reshard_after_forward: True
    save_full_model_weights: True
    grad_scaler:
      enabled: False
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: True
      precision: "bf16"

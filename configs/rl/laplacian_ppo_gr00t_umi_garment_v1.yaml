# garment v1 (overnight 2026-09-30): UMICore-v0.17.9@30000 (first checkpoint with the W40 lpr1 garment-shelf data)
# PPO on GarmentRLEnv (single package, left arm), v5 optimisation settings, 60 epochs.
# v2 diagnosis: grad_norm 300-1000 vs clip 1.0 with value loss dominating -> policy gradient scaled to ~0.2%.
defaults:
  - env/laplacian_garment_left_v1@env.train
  - env/laplacian_garment_left_v1@env.eval
  - model/gr00t_n1d7_umi@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/
    - file://${oc.env:UMI_RL_ROOT}/configs/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-7

runner:
  task_type: embodied
  logger:
    log_path: /home/thanh/rlinf-runs/logs/umi-rl
    project_name: finetune-gr00t-n1d7
    experiment_name: "laplacian_ppo_v0179_garment_left_v1"
    logger_backends: ["tensorboard", "wandb"]
  max_epochs: 60
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.001
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 1.0e6         # v3b: value clipping effectively off (RLinf clamps with the raw value; null would crash)
  huber_delta: 1.0
  gamma: 0.95              # horizon ~20 chunks, the episode is 15
  gae_lambda: 0.95
  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 32         # 8 env workers x 4 envs
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240  # 15 chunks of 16 = one episode
    auto_reset: True
  eval:
    total_num_envs: 32
    group_size: 1
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    is_eval: True

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    backbone_model_path: ${actor.model.backbone_model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 96       # 32 envs x 15 chunks = 480 samples, 60 per actor rank, divisible by 96/8 = 12
  seed: 1234
  enable_offload: True
  model:
    model_path: /data/models/UMICore-v0.17.9/checkpoint-30000
    add_value_head: True
    rl_head_config:
      add_value_head: True
      padding_value: 0
      noise_level: 0.6
  optim:
    lr: 2.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 10.0
    critic_warmup_steps: 20
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    gradient_checkpointing: True
    use_orig_params: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False
critic:
  use_critic_model: False

# laplacian-gym livinglab pick-and-place (LPR1, objects on the shelf -> basket) as an RLinf env.
env_type: laplacian_gym
total_num_envs: null
auto_reset: true
ignore_terminations: false
use_rel_reward: false
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
total_num_group_envs: 10000
max_steps_per_rollout_epoch: 96      # 15 Hz frames per rollout epoch, multiple of 16
max_episode_steps: 240               # 16 s at 15 Hz
enable_offload: false
video_cfg:
  save_video: false
  info_on_video: false
  fps: 15
  video_base_dir: /home/thanh/rlinf-runs/logs/umi-rl/videos
init_params:
  scene: configs/livinglab_hq.yaml   # relative to the laplacian-gym checkout
  spawn_count: 2
  cameras: [cam_wrist_left, cam_wrist_right, cam_head]
  wrist_hw: [480, 640]
  settle_s: 0.5
  ik_iters: 4
  dense_reward: 0.0
  success_reward: 1.0
  prompt: "Pick up the objects on the shelf and place them in the basket"

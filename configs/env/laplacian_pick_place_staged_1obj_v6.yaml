# v6: v5 reward + gripper 'boost' mapping (full close when the policy commands >= 0.3), which made v5@110 succeed 6/8 in eval.
env_type: laplacian_gym
total_num_envs: null
auto_reset: true
ignore_terminations: false
use_rel_reward: false
reward_scale: 0.02                # v3: returns ~2 instead of ~10 so the value loss no longer dominates the clipped gradient
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
total_num_group_envs: 10000
max_steps_per_rollout_epoch: 240  # one full episode per env per rollout epoch (15 chunks of 16)
max_episode_steps: 240            # 16 s at 15 Hz
enable_offload: false
video_cfg:
  save_video: false
  info_on_video: false
  fps: 15
  video_base_dir: /home/thanh/rlinf-runs/logs/umi-rl/videos
init_params:
  scene: configs/livinglab_hq.yaml
  spawn_count: 1
  cameras: [cam_wrist_left, cam_wrist_right, cam_head]
  wrist_hw: [480, 640]
  settle_s: 0.5
  ik_iters: 4
  prompt: "Pick up the objects on the shelf and place them in the basket"
  gripper_mode: boost
  gripper_thresh: 0.3
  reward:
    staged: true
    release_bonus: 2.0
    idle_arm_penalty: 0.05
    disturb_penalty: 0.5
    regress_penalty: 2.0
    success: 13.0
    completion_bonus: 10.0
    align_dist: 0.05
    align_bonus: 1.0
    gate_grasp_on_align: true
    align_needs_open: false
    close_bonus: 1.0
